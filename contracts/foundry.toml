[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "london"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]

fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./out" }]

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 128
fail_on_revert = false

[rpc_endpoints]
mezo_testnet = "${MEZO_TESTNET_RPC_URL}"
